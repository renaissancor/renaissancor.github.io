# Basic site metadata
site_name: Renaissancoriate
site_description: Systems Programming & Software Engineering Portfolio
site_author: Renaissancor
site_url: https://renaissancor.github.io

# Theme configuration
theme:
  name: material
  language: en

  palette:
    scheme: slate
    primary: light green
    accent: green

  font:
    text: Roboto
    code: Fira Code

  features:
    - navigation.top
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - content.code.annotate
    - content.code.copy
    - search.highlight
    - search.share
    - toc.follow

# Markdown extensions for enhanced rendering
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      linenums_style: table
      guess_lang: false
      use_pygments: true

  - pymdownx.snippets

extra_css:
  - stylesheets/typst.css

hooks:
  - hooks/typst_diagrams.py

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true

docs_dir: "docs"

# ---------------------------------------------------------------------------
# Navigation — canonical taxonomy (flat).
#   Two discipline rules remove overlap:
#     theory <-> platform        : OS theory -> Operating Systems;
#                                  platform mechanics -> Windows/Linux Systems.
#     translate <-> execute      : code -> machine code / disassembly -> Compilers
#                                  & Low-Level; hardware behavior -> Computer Architecture.
#   Raw daily notes + exam scratch are preserved under "Archive", pending distillation.
# ---------------------------------------------------------------------------
nav:
  - Home: index.md

  - Setup:
    - Setup/Mac_dev_setup.md
    - Setup/Harness_setup.md
    - Setup/iterm2_setup.md
    - Setup/WSL_dev_setup.md
    - Setup/Win_dev_setup.md

  - C / C++:
    - Cpp/cpp-06-templates-exceptions-raii.md

  - Data Structures:
    - Data_Structure/ds-03-trees-and-traversals.md

  - Algorithms:
    - Algorithm/Parametric_Search.md

  - Computer Architecture:
    - Architecture/arch-01-cpu-cache-coherence.md
    - Architecture/arch-02-roofline-model.md
    - Architecture/arch-03-gpu-memory-budget-llm-serving.md
    - Architecture/arch-04-constrained-decoding-llm-serving.md

  - Compilers & Low-Level:
    - Compilers/asm-02-stack-frames-calling-conventions.md
    - Compilers/asm-04-c-runtime-and-executable.md
    - Compilers/gpu-kernel-dsl-triton.md

  - Operating Systems:
    - Operating_Systems/os-01-processes-and-threads.md
    - Operating_Systems/os-03-synchronization-and-deadlock.md
    - Operating_Systems/os-04-tlb-page-faults-and-copy-on-write.md

  - Windows Systems:
    - Windows_System_Programming/win-04-async-io-and-iocp.md
    - Windows_System_Programming/win-08-iocp.md

  - Computer Networks:
    - Computer_Network/nw-tcp-loss-signals-and-round-trips.md

  - Data Systems:
    - Data_Systems/db-01-namespaces-and-catalogs.md
    - Data_Systems/db-02-derived-data-placement.md
    - Data_Systems/db-03-write-skew-and-isolation.md
    - Data_Systems/db-04-sequential-writes-wal-and-lsm.md
    - Data_Systems/db-05-delete-and-space-reclamation.md
    - Data_Systems/db-06-replication-mechanics.md
    - Data_Systems/db-07-clustered-vs-heap-and-joins.md

  - Distributed Systems:
